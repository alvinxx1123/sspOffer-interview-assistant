# 复制为 application-local.yml 并填写（该文件已被 .gitignore 忽略），
# 或使用下方注释中的环境变量。不要在 application.yml 或 Git 中提交真实密钥。

# 通用 LLM 配置（OpenAI 兼容接口）
llm:
  apiKey: "${LLM_API_KEY:${DEEPSEEK_API_KEY:}}"
  baseUrl: "${LLM_BASE_URL:https://api.deepseek.com}"
  model: "${LLM_MODEL:deepseek-v4-flash}"

# RAG Embedding 配置
embedding:
  apiKey: "${EMBEDDING_API_KEY:${ZHIPU_API_KEY:}}"
  baseUrl: "${EMBEDDING_BASE_URL:https://open.bigmodel.cn/api/paas/v4}"
  model: "${EMBEDDING_MODEL:embedding-3}"

app:
  admin-password: "${APP_ADMIN_PASSWORD:}"
